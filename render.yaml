# Render blueprint for the API. The frontend deploys to Vercel (see README).
services:
  - type: web
    name: lingo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/lingo.db
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: ENABLE_DEV_ROUTES
        value: "false"
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
